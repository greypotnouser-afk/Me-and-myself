<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Preminyan</title>
    <link rel="stylesheet" href="style.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    
    <audio id="bgMusic" loop preload="auto">
        <source src="https://upload.wikimedia.org/wikipedia/commons/6/60/Kevin_MacLeod_-_Fluffing_a_Duck.ogg" type="audio/ogg">
    </audio>
    <audio id="meowSound" preload="auto">
        <source src="https://upload.wikimedia.org/wikipedia/commons/4/4d/Cat_meow.ogg" type="audio/ogg">
    </audio>

    <div class="container">
        <h1 class="title">premium</h1>
        
        <div class="profile-wrapper" id="catProfile">
            
            <div class="ears">
                <svg viewBox="0 0 100 50" xmlns="http://www.w3.org/2000/svg">
                    <path class="ear left-ear" d="M10,50 L25,10 L45,40 Z" fill="#333" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
                    <path class="ear right-ear" d="M55,40 L75,10 L90,50 Z" fill="#333" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
                                     <path d="M20,45 L25,20 L35,40 Z" fill="#ffb6c1"/>
                    <path d="M65,40 L75,20 L80,45 Z" fill="#ffb6c1"/>
                </svg>
            </div>
            
            
            <img src="e5a47602316ccb150ebb84a5f705224c_2.jpg" alt="preminyan" class="profile-img">
            
           
            <div class="tail-container">
                <svg class="tail" viewBox="0 0 50 100" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10,10 Q40,40 30,80 Q25,95 15,85 Q20,50 5,20 Z" fill="#333" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>

        <p class="bio">click to pet preminyan</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
