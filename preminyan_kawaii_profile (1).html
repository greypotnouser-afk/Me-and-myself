<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preminyan - Handmade Kawaii Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Using handwritten fonts for a human touch -->
    <link href="https://fonts.googleapis.com/css2?family=Delius&family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Mali', cursive;
            background-color: #fcf4dd; /* Creamy paper background */
            /* Doodle/Grid background to look like a notebook */
            background-image: 
                linear-gradient(#f0e4cc 1px, transparent 1px),
                linear-gradient(90deg, #f0e4cc 1px, transparent 1px);
            background-size: 30px 30px;
            overflow-x: hidden;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Custom Paw Cursor! */
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"><path d="M12 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-5 3c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM8.5 10c-2.5 0-4.5 2-4.5 4.5S6 19 8.5 19c1 0 1.9-.3 2.6-.8.3.2.6.4.9.4s.6-.2.9-.4c.7.5 1.6.8 2.6.8 2.5 0 4.5-2 4.5-4.5S18 10 15.5 10c-1.5 0-2.8.7-3.5 1.8C11.3 10.7 10 10 8.5 10z" fill="%23ff758f" stroke="%23333" stroke-width="1"/></svg>'), auto;
        }

        h1, h2 {
            font-family: 'Delius', cursive;
        }

        /* The handmade, sketchy box effect */
        .sketch-border {
            border: 4px solid #3d3b40;
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            background: #ffffff;
            box-shadow: 12px 12px 0px #ffb6c1, 12px 12px 0px 4px #3d3b40;
        }

        .sketch-border-img {
            border: 4px solid #3d3b40;
            /* A slightly different uneven radius for the image block */
            border-radius: 20px 255px 30px 225px/255px 20px 225px 30px;
        }

        /* Washi tape effect for the bio */
        .washi-tape {
            background-color: #ffdce1;
            border: 2px solid #3d3b40;
            transform: rotate(-3deg);
            box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
        }

        @keyframes subtle-float {
            0% { transform: translateY(0px) rotate(1deg); }
            50% { transform: translateY(-8px) rotate(-1deg); }
            100% { transform: translateY(0px) rotate(1deg); }
        }
        .animate-organic-float {
            animation: subtle-float 5s ease-in-out infinite;
        }

        /* Bouncy squish for petting */
        @keyframes organic-squish {
            0% { transform: scale(1) rotate(0deg); }
            40% { transform: scale(0.85, 1.1) rotate(-3deg); }
            70% { transform: scale(1.05, 0.95) rotate(2deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        .squish-active {
            animation: organic-squish 0.4s cubic-bezier(0.28, 0.84, 0.42, 1);
        }

        /* Floating heart doodle */
        @keyframes floatDoodle {
            0% { opacity: 1; transform: translateY(0) scale(1) rotate(-10deg); }
            100% { opacity: 0; transform: translateY(-70px) scale(1.5) rotate(20deg); }
        }
        .floating-heart {
            position: absolute;
            pointer-events: none;
            animation: floatDoodle 1.2s ease-out forwards;
            z-index: 50;
            filter: drop-shadow(2px 2px 0px #333);
        }

        .ear-wrapper {
            position: absolute;
            z-index: 30;
            width: 70px;
            height: 70px;
            transition: transform 0.2s;
            pointer-events: none;
        }
        .ear-left {
            top: -25px;
            left: -10px;
            transform: rotate(-15deg);
            transform-origin: bottom right;
        }
        .ear-right {
            top: -25px;
            right: -10px;
            transform: rotate(15deg) scaleX(-1); /* Flipped for symmetry */
            transform-origin: bottom left;
        }

        @keyframes twitchLeftOrganic {
            0%, 100% { transform: rotate(-15deg); }
            40% { transform: rotate(-35deg); }
            70% { transform: rotate(-5deg); }
        }
        @keyframes twitchRightOrganic {
            0%, 100% { transform: rotate(15deg) scaleX(-1); }
            40% { transform: rotate(35deg) scaleX(-1); }
            70% { transform: rotate(5deg) scaleX(-1); }
        }
        .twitch-l-active { animation: twitchLeftOrganic 0.4s ease-in-out; }
        .twitch-r-active { animation: twitchRightOrganic 0.4s ease-in-out; }

        .tail-wrapper {
            position: absolute;
            bottom: -30px;
            right: -40px;
            width: 100px;
            height: 120px;
            z-index: 10; /* Behind the image */
            transform-origin: top left;
            animation: organic-wag 4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes organic-wag {
            0% { transform: rotate(-10deg); }
            50% { transform: rotate(25deg); }
            100% { transform: rotate(-10deg); }
        }

        /* Helper for overlay */
        #start-overlay {
            background: rgba(252, 244, 221, 0.95);
        }
    </style>
</head>
<body class="text-[#3d3b40]">

    <!-- Start Overlay for Audio Autoplay Policy -->
    <div id="start-overlay" class="fixed inset-0 z-50 flex flex-col items-center justify-center transition-opacity duration-700">
        <div class="sketch-border p-8 flex flex-col items-center max-w-sm text-center transform -rotate-2 cursor-pointer hover:rotate-0 transition-transform">
            <svg class="w-16 h-16 mb-4 animate-bounce" viewBox="0 0 24 24" fill="#ff758f" stroke="#3d3b40" stroke-width="1.5">
                <path d="M12 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-5 3c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM8.5 10c-2.5 0-4.5 2-4.5 4.5S6 19 8.5 19c1 0 1.9-.3 2.6-.8.3.2.6.4.9.4s.6-.2.9-.4c.7.5 1.6.8 2.6.8 2.5 0 4.5-2 4.5-4.5S18 10 15.5 10c-1.5 0-2.8.7-3.5 1.8C11.3 10.7 10 10 8.5 10z"/>
            </svg>
            <h2 class="text-3xl font-bold text-[#ff6b81] mb-2 tracking-wide">Ready?</h2>
            <p class="font-bold text-lg">Click to enter & turn sound on!</p>
        </div>
    </div>

    <!-- Main Card Container -->
    <div id="main-content" class="relative opacity-0 transition-opacity duration-1000 p-6">
        
        <!-- Handmade Decorative Doodles in Background -->
        <div class="absolute -top-12 -left-16 text-[#ffb6c1] text-5xl transform -rotate-12 animate-pulse" style="filter: drop-shadow(2px 2px 0px #3d3b40);">★</div>
        <div class="absolute top-1/2 -right-16 text-[#82d8d8] text-6xl transform rotate-45" style="filter: drop-shadow(2px 2px 0px #3d3b40);">✿</div>

        <!-- The Card -->
        <div class="sketch-border p-10 flex flex-col items-center w-[340px] max-w-full animate-organic-float relative z-20">
            
            <!-- Image Container (Interactive) -->
            <div id="pet-area" class="relative mt-2 mb-8 group" style="cursor: inherit;">
                
                <!-- SVG Tail (Behind image) -->
                <div class="tail-wrapper">
                    <!-- Custom Cartoon Tail SVG -->
                    <svg viewBox="0 0 100 120" width="100%" height="100%">
                        <path d="M 20 10 C 60 20, 90 60, 75 100 C 65 125, 30 115, 40 90 C 45 75, 45 40, 10 20 Z" fill="#ffffff" stroke="#3d3b40" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
                    </svg>
                </div>
                
                <!-- SVG Ears (In front of image) -->
                <div class="ear-wrapper ear-left" id="ear-l">
                    <svg viewBox="0 0 100 100" width="100%" height="100%">
                        <!-- Outer Ear -->
                        <path d="M15,90 Q10,40 50,15 Q90,40 85,90 Z" fill="#ffffff" stroke="#3d3b40" stroke-width="6" stroke-linejoin="round"/>
                        <!-- Inner Pink Ear -->
                        <path d="M32,85 Q28,55 50,38 Q72,55 68,85 Z" fill="#ffb6c1" stroke="#3d3b40" stroke-width="4" stroke-linejoin="round"/>
                    </svg>
                </div>
                
                <div class="ear-wrapper ear-right" id="ear-r">
                    <svg viewBox="0 0 100 100" width="100%" height="100%">
                        <!-- Outer Ear -->
                        <path d="M15,90 Q10,40 50,15 Q90,40 85,90 Z" fill="#ffffff" stroke="#3d3b40" stroke-width="6" stroke-linejoin="round"/>
                        <!-- Inner Pink Ear -->
                        <path d="M32,85 Q28,55 50,38 Q72,55 68,85 Z" fill="#ffb6c1" stroke="#3d3b40" stroke-width="4" stroke-linejoin="round"/>
                    </svg>
                </div>
                
                <!-- The Main Profile Image: e5a47602316ccb150ebb84a5f705224c_2.jpg -->
                <div class="relative z-20 overflow-hidden w-52 h-52 sketch-border-img bg-white transition-transform duration-300 group-hover:-translate-y-2 group-hover:rotate-1" id="profile-img-container">
                    <img id="profile-img" src="e5a47602316ccb150ebb84a5f705224c_2.jpg" alt="Premium" class="w-full h-full object-cover">
                </div>
                
                <!-- Little hand-drawn action lines on hover -->
                <div class="absolute -top-4 -right-4 text-[#ffb6c1] text-2xl font-bold opacity-0 group-hover:opacity-100 transition-opacity z-30 transform rotate-12" style="text-shadow: 2px 2px 0 #3d3b40;">!!</div>
            </div>

            <!-- Name -->
            <h1 class="text-5xl font-bold mb-3 text-[#3d3b40] tracking-wider transform -rotate-2 relative">
                premium
                <!-- Underline doodle -->
                <svg class="absolute -bottom-2 left-0 w-full h-3" viewBox="0 0 100 20" preserveAspectRatio="none">
                    <path d="M 0 10 Q 50 20 100 5" fill="none" stroke="#82d8d8" stroke-width="4" stroke-linecap="round"/>
                </svg>
            </h1>
            
            <!-- Bio (Washi Tape Style) -->
            <div class="washi-tape px-6 py-2 mt-4 inline-block z-10">
                <p class="text-[#3d3b40] font-bold text-lg m-0 flex items-center gap-2">
                    <i class="fa-solid fa-paw text-[#ff6b81] text-sm"></i>
                    click to pet preminyan
                    <i class="fa-solid fa-paw text-[#ff6b81] text-sm"></i>
                </p>
            </div>
            
        </div>
    </div>

    <!-- Audio Elements (Wikimedia Commons) -->
    <!-- BGM: Kevin MacLeod - Wallpaper (Light, cute, reliable public domain) -->
    <audio id="bgm" loop preload="auto">
        <source src="https://upload.wikimedia.org/wikipedia/commons/4/4b/Kevin_MacLeod_-_Wallpaper.ogg" type="audio/ogg">
    </audio>
    
    <!-- Meow Sound Effect: Real Cat Meow -->
    <audio id="meow-sfx" preload="auto">
        <source src="https://upload.wikimedia.org/wikipedia/commons/3/30/Meow_of_a_cat.ogg" type="audio/ogg">
    </audio>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('start-overlay');
            const mainContent = document.getElementById('main-content');
            const bgm = document.getElementById('bgm');
            const meowSfx = document.getElementById('meow-sfx');
            const petArea = document.getElementById('pet-area');
            const profileImgContainer = document.getElementById('profile-img-container');
            const earL = document.getElementById('ear-l');
            const earR = document.getElementById('ear-r');
            
            let isMusicPlaying = false;

            // Handle first interaction to remove overlay and play music
            overlay.addEventListener('click', () => {
                overlay.style.opacity = '0';
                setTimeout(() => {
                    overlay.style.display = 'none';
                    mainContent.style.opacity = '1';
                }, 700);

                // Play background music
                if (!isMusicPlaying) {
                    bgm.volume = 0.25; // Nice and soft
                    bgm.play().catch(e => console.log("Audio play failed, user might need to interact more:", e));
                    isMusicPlaying = true;
                }
            });

            // Handle Petting Interaction
            petArea.addEventListener('click', (e) => {
                // Play Meow Sound
                meowSfx.currentTime = 0; // reset to start if clicked rapidly
                meowSfx.volume = 0.7;
                meowSfx.play().catch(e => console.log("SFX play failed:", e));

                // Add squish animation to image
                profileImgContainer.classList.remove('squish-active');
                void profileImgContainer.offsetWidth; // trigger reflow to restart animation
                profileImgContainer.classList.add('squish-active');

                // Twitch ears organically
                earL.classList.remove('twitch-l-active');
                earR.classList.remove('twitch-r-active');
                void earL.offsetWidth;
                void earR.offsetWidth;
                earL.classList.add('twitch-l-active');
                earR.classList.add('twitch-r-active');

                // Spawn floating hearts where clicked
                createDoodleHeart(e.clientX, e.clientY);
            });

            // Function to spawn tiny floating doodle hearts on click
            function createDoodleHeart(x, y) {
                const heart = document.createElement('div');
                // Cute SVG doodle heart
                heart.innerHTML = `
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#ff6b81" stroke="#3d3b40" stroke-width="2" stroke-linejoin="round"/>
                    </svg>`;
                heart.className = 'floating-heart';
                
                // Adjust position slightly so it centers on cursor
                heart.style.left = (x - 12) + 'px';
                heart.style.top = (y - 12) + 'px';
                
                document.body.appendChild(heart);

                // Remove from DOM after animation finishes
                setTimeout(() => {
                    heart.remove();
                }, 1200);
            }
        });
    </script>
</body>
</html>
